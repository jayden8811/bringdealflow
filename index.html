<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bringdealflow</title>
  <meta name="description" content="Sales calls worth your time, booked for you, free for 30 days to see the quality.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Newsreader";
      src: url("/fonts/newsreader.woff2") format("woff2");
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("/fonts/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ink: #f3ede3;
      /* 1 unit = 1px of the 1122px-wide reference composition */
      --u: clamp(0.34px, calc(100vw / 1122), 0.7px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: #000; }

    body {
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 9.6svh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      display: block;
      width: calc(var(--u) * 98);
      height: calc(var(--u) * 112);
      margin-bottom: calc(var(--u) * 59);
    }

    h1 {
      font-family: "Newsreader", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: calc(var(--u) * 56.8);
      line-height: calc(var(--u) * 62);
      letter-spacing: 0;
      font-optical-sizing: auto;
      white-space: nowrap;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 18);
      width: calc(var(--u) * 344);
      height: calc(var(--u) * 73);
      margin-top: calc(var(--u) * 97);
      border: calc(var(--u) * 2) solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      text-decoration: none;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: calc(var(--u) * 20.2);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: background-color .2s ease, color .2s ease;
    }
    .btn svg {
      width: calc(var(--u) * 24);
      height: calc(var(--u) * 24);
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn:hover { background: var(--ink); color: #000; }

    .email {
      margin-top: calc(var(--u) * 25);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: calc(var(--u) * 17.8);
      line-height: calc(var(--u) * 24);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .email a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.png" alt="">
    <h1>Sales calls worth your time, booked for you,<br>free for 30 days to see the quality.</h1>
    <a class="btn" href="mailto:contact@bringdealflow.com">Contact
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </a>
    <p class="email"><a href="mailto:contact@bringdealflow.com">contact@bringdealflow.com</a></p>
  </main>
</body>
</html>
